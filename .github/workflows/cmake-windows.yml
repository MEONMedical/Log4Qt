name: CMake Windows build and test

on:
  push:
    branches: [ master, experimental/v2-modernize-performance ]
  pull_request:
    branches: [ master, experimental/v2-modernize-performance ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-msvc:
    name: MSVC - Qt ${{ matrix.qt_version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 6.5.3 is pinned to the Visual Studio 2022 image on purpose: its
          # qvarlengtharray.h copies through stdext::make_checked_array_iterator,
          # which the STL of Visual Studio 2026 (MSVC 14.5x, the toolchain on
          # windows-latest since June 2026) no longer provides. Qt fixed this
          # after 6.5.3, but 6.5.4+ are commercial-only, so no open-source
          # Qt 6.5 builds with a current MSVC. When windows-2022 is retired,
          # drop this entry instead of moving it to a newer image.
          - qt_version: '6.5.3'
            os: windows-2022
          - qt_version: '6.8.3'
            os: windows-latest
          - qt_version: '6.10.2'
            os: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake ${{ github.workspace }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -GNinja

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ runner.workspace }}/build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

  build-mingw:
    name: MinGW - Qt ${{ matrix.qt_version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_version: '6.5.3'
            mingw_tools: 'tools_mingw1310'
          - qt_version: '6.8.3'
            mingw_tools: 'tools_mingw1310'
          - qt_version: '6.10.2'
            mingw_tools: 'tools_mingw1310'

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        arch: win64_mingw
        tools: ${{ matrix.mingw_tools }}

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake ${{ github.workspace }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G "MinGW Makefiles"

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ runner.workspace }}/build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
